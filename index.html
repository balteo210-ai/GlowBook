// ==================== APP ====================
const App = () => {
  const [view, setView] = useState('login');
  const [clientTab, setClientTab] = useState('home');
  const [adminTab, setAdminTab] = useState('dashboard');
  const [clientView, setClientView] = useState('home');
  const [adminView, setAdminView] = useState('dashboard');
  const [booking, setBooking] = useState({ step: 0, svcs: [], date: '', time: '', notes: '' });
  const [toasts, setToasts] = useState([]);
  const [selClient, setSelClient] = useState(null);
  const [appts, setAppts] = useState(APPTS_DB);
  const [reviews, setReviews] = useState(REVIEWS_DB);
  const [clients, setClients] = useState(CLIENTS_DB);
  const [pkgs, setPkgs] = useState(PACKAGES_DB);
  const [history, setHistory] = useState([]);

  const toast = useCallback((msg, type = 'ok') => {
    const id = Date.now();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000);
  }, []);

  const goClient = useCallback((tab, subView) => {
    setHistory(p => [...p, { tab: clientTab, view: clientView }]);
    setClientTab(tab);
    setClientView(subView || 'home');
  }, [clientTab, clientView]);

  const goBackClient = useCallback(() => {
    if (clientView !== 'home') {
      setClientView('home');
      return;
    }
    if (history.length > 0) {
      const prev = history[history.length - 1];
      setHistory(p => p.slice(0, -1));
      setClientTab(prev.tab);
      setClientView(prev.view);
      return;
    }
    setClientTab('home');
    setClientView('home');
  }, [clientView, history]);

  const goAdmin = useCallback((tab, subView) => {
    setAdminTab(tab);
    setAdminView(subView || tab);
  }, []);

  const goBackAdmin = useCallback(() => {
    if (adminView !== adminTab) {
      setAdminView(adminTab);
      return;
    }
    if (adminTab !== 'dashboard') {
      setAdminTab('dashboard');
      setAdminView('dashboard');
    }
  }, [adminView, adminTab]);

  const navClient = useCallback((tab) => {
    setHistory([]);
    setClientTab(tab);
    setClientView('home');
  }, []);

  return (
    <ToastCtx.Provider value={toast}>
      <NavCtx.Provider value={{
        view, setView, clientTab, adminTab, clientView, adminView,
        goClient, goBackClient, goAdmin, goBackAdmin, navClient,
        booking, setBooking,
        appts, setAppts, reviews, setReviews, clients, setClients, pkgs, setPkgs,
        selClient, setSelClient, toast
      }}>
        <div className="max-w-md mx-auto min-h-screen bg-white relative overflow-hidden">
          {toasts.map(t => <Toast key={t.id} msg={t.msg} type={t.type} />)}
          {view === 'login' && <LoginScreen />}
          {view === 'client' && <ClientArea />}
          {view === 'admin' && <AdminArea />}
        </div>
      </NavCtx.Provider>
    </ToastCtx.Provider>
  );
};

// ==================== CLIENT BOOKING ====================
const ClientBook = () => {
  const { booking, setBooking, navClient, toast, goBackClient } = useContext(NavCtx);
  const [cat, setCat] = useState('all');

  const totalDur = booking.svcs.reduce((s, sv) => s + sv.dur, 0);
  const totalPrice = booking.svcs.reduce((s, sv) => s + sv.price, 0);
  const filtered = cat === 'all' ? SERVICES : SERVICES.filter(sv => sv.cat === cat);

  const toggleSvc = (sv) => {
    setBooking(p => ({
      ...p,
      svcs: p.svcs.find(s => s.id === sv.id) ? p.svcs.filter(s => s.id !== sv.id) : [...p.svcs, sv]
    }));
  };

  const handleSend = () => {
    toast('Richiesta inviata! Glow Beauty Studio ti confermerà a breve 🌸');
    setTimeout(() => {
      setBooking({ step: 0, svcs: [], date: '', time: '', notes: '' });
      navClient('home');
    }, 1500);
  };

  const handleBack = () => {
    if (booking.step > 0) {
      setBooking(p => ({ ...p, step: p.step - 1 }));
    } else {
      navClient('home');
    }
  };

  if (booking.step === 4) return (
    <div className="page flex flex-col items-center justify-center min-h-[70vh] p-6 text-center">
      <div className="w-20 h-20 bg-pink rounded-full flex items-center justify-center mb-6 scale-in">
        <span className="text-4xl">✅</span>
      </div>
      <h2 className="text-xl font-bold mb-3">Richiesta inviata! 🌸</h2>
      <p className="text-sub text-sm mb-8 leading-relaxed">Glow Beauty Studio ha ricevuto la tua richiesta.<br/>Ti confermeremo a breve via WhatsApp.</p>
      <button onClick={() => navClient('home')} className="bg-text text-white px-8 py-3 rounded-2xl font-bold text-sm active:scale-95 transition">Torna alla Home</button>
    </div>
  );

  return (
    <div className="page">
      <Header title="Prenota" back onBack={handleBack} />
      <div className="p-4">
        <div className="flex items-center justify-center gap-2 mb-5">
          {[0, 1, 2, 3].map(i => (
            <React.Fragment key={i}>
              <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition ${i < booking.step ? 'bg-accent text-white' : i === booking.step ? 'bg-pink text-text' : 'bg-gray text-sub'}`}>{i + 1}</div>
              {i < 3 && <div className={`w-8 h-0.5 ${i < booking.step ? 'bg-accent' : 'bg-border'}`} />}
            </React.Fragment>
          ))}
        </div>

        {booking.step === 0 && (
          <>
            <h3 className="font-bold text-sm mb-3">Scegli i servizi</h3>
            <div className="flex gap-2 overflow-x-auto mb-4 pb-1">
              {CATS.map(c => (
                <button key={c.id} onClick={() => setCat(c.id)} className={`flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold ${cat === c.id ? 'bg-accent text-white' : 'bg-gray text-sub'}`}>{c.name}</button>
              ))}
            </div>
            <div className="space-y-3">
              {filtered.map(sv => {
                const sel = booking.svcs.find(s => s.id === sv.id);
                return (
                  <button key={sv.id} type="button" onClick={() => toggleSvc(sv)} className={`w-full text-left p-3 rounded-xl border transition active:scale-[0.98] ${sel ? 'border-accent bg-pink/30' : 'border-border bg-white'}`}>
                    <div className="flex gap-3">
                      <div className="w-14 h-14 rounded-lg bg-gray flex items-center justify-center text-xl flex-shrink-0">{sv.emoji}</div>
                      <div className="flex-1">
                        <div className="flex justify-between items-start">
                          <p className="text-sm font-bold">{sv.name}</p>
                          {sel && <I.Check />}
                        </div>
                        <p className="text-[10px] text-sub mt-0.5">{sv.dur} min · {sv.price}€</p>
                        <p className="text-[11px] text-sub mt-1 leading-snug">{sv.desc}</p>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
            {booking.svcs.length > 0 && (
              <div className="fixed bottom-16 left-0 right-0 px-4 z-30">
                <div className="max-w-md mx-auto bg-text text-white p-4 rounded-2xl flex justify-between items-center shadow-xl">
                  <div>
                    <p className="text-sm font-bold">{booking.svcs.length} servizi</p>
                    <p className="text-xs opacity-70">{totalDur} min · {totalPrice}€</p>
                  </div>
                  <button type="button" onClick={() => setBooking(p => ({ ...p, step: 1 }))} className="bg-accent px-5 py-2 rounded-xl text-sm font-bold active:scale-95 transition">Avanti</button>
                </div>
              </div>
            )}
          </>
        )}

        {booking.step === 1 && (
          <>
            <h3 className="font-bold text-sm mb-3">Scegli il giorno</h3>
            <div className="grid grid-cols-3 gap-2 mb-4">
              {[0, 1, 2, 3, 4, 5].map(i => {
                const d = new Date(); d.setDate(d.getDate() + i + 1);
                if (d.getDay() === 0) return <div key={i} />;
                const ds = d.toISOString().split('T')[0];
                return (
                  <button key={i} type="button" onClick={() => setBooking(p => ({ ...p, date: ds }))} className={`p-3 rounded-xl border text-center transition active:scale-95 ${booking.date === ds ? 'border-accent bg-pink/30' : 'border-border bg-white'}`}>
                    <p className="text-[10px] text-sub">{d.toLocaleDateString('it', { weekday: 'short' })}</p>
                    <p className="text-lg font-bold">{d.getDate()}</p>
                    <p className="text-[10px] text-sub">{d.toLocaleDateString('it', { month: 'short' })}</p>
                  </button>
                );
              })}
            </div>
            {booking.date && <button type="button" onClick={() => setBooking(p => ({ ...p, step: 2 }))} className="w-full bg-accent text-white py-3 rounded-2xl font-bold text-sm active:scale-95 transition mt-2">Continua</button>}
          </>
        )}

        {booking.step === 2 && (
          <>
            <h3 className="font-bold text-sm mb-1">Scegli l'orario</h3>
            <p className="text-xs text-sub mb-4">{booking.date}</p>
            <div className="flex gap-2 mb-4 text-[10px] text-sub">
              <div className="flex items-center gap-1"><div className="w-3 h-3 bg-white border border-border rounded" /> Disponibile</div>
              <div className="flex items-center gap-1"><div className="w-3 h-3 bg-gray rounded" /> Occupato</div>
            </div>
            <div className="grid grid-cols-4 gap-2 mb-4">
              {['09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30'].map((t, i) => {
                const avail = i % 3 !== 2;
                return (
                  <button key={t} type="button" onClick={() => avail && setBooking(p => ({ ...p, time: t }))} disabled={!avail} className={`py-2.5 rounded-xl text-xs font-semibold border transition ${avail ? (booking.time === t ? 'border-accent bg-pink/30 text-accent' : 'border-border bg-white') : 'bg-gray text-sub border-transparent opacity-50'}`}>
                    {t}
                  </button>
                );
              })}
            </div>
            {booking.time && <button type="button" onClick={() => setBooking(p => ({ ...p, step: 3 }))} className="w-full bg-accent text-white py-3 rounded-2xl font-bold text-sm active:scale-95 transition">Continua</button>}
          </>
        )}

        {booking.step === 3 && (
          <div className="space-y-4">
            <h3 className="font-bold text-sm">Riepilogo</h3>
            <div className="bg-white border border-border rounded-xl p-4 space-y-2">
              {booking.svcs.map(sv => (
                <div key={sv.id} className="flex justify-between text-sm">
                  <span>{sv.name}</span>
                  <span className="font-semibold">{sv.price}€</span>
                </div>
              ))}
              <div className="border-t border-border pt-2 flex justify-between">
                <span className="font-bold">Totale</span>
                <span className="font-bold text-accent">{totalPrice}€</span>
              </div>
              <div className="flex justify-between text-xs text-sub">
                <span>Durata</span>
                <span>{totalDur} min</span>
              </div>
              <div className="flex gap-4 text-xs text-sub pt-1">
                <span className="flex items-center gap-1"><I.Calendar /> {booking.date}</span>
                <span className="flex items-center gap-1"><I.Clock /> {booking.time}</span>
              </div>
            </div>
            <div className="bg-white border border-border rounded-xl p-4">
              <label className="text-xs font-bold text-sub uppercase tracking-wide">Note (opzionale)</label>
              <textarea value={booking.notes} onChange={e => setBooking(p => ({ ...p, notes: e.target.value }))} placeholder="Richieste speciali..." className="w-full mt-2 p-3 bg-gray border border-border rounded-xl text-sm focus:outline-none focus:border-accent resize-none" rows={3} />
            </div>
            <button type="button" onClick={handleSend} className="w-full bg-accent text-white py-3.5 rounded-2xl font-bold text-sm active:scale-95 transition shadow-lg">Invia richiesta prenotazione</button>
          </div>
        )}
      </div>
    </div>
  );
};

        <button key={it.id} type="button" onClick={() => goAdmin(it.id)} className={`flex flex-col items-center gap-0.5 ${adminTab === it.id ? 'text-accent' : 'text-sub'}`}>
          {it.icon}
          <span className="text-[10px] font-medium">{it.l}</span>
        </button>
      ))}
    </div>
  );
};

// ==================== RENDER ====================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
