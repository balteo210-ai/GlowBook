.typing-dot{animation:typing 1.4s infinite}

// ======================== CONTEXT ========================
const Ctx=createContext();
function Provider({children}){
const[user,setUser]=useState(null);
const[data,setData]=useState(MOCK);
const[toasts,setToasts]=useState([]);
const[page,setPage]=useState('login');
const[prevPage,setPrevPage]=useState('login');
const[notifCount,setNotifCount]=useState(2);

const addToast=useCallback((msg,type='success')=>{
const id=Date.now()+Math.random();
setToasts(p=>[...p,{id,msg,type}]);
setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);
},[]);

const updateData=useCallback((entity,id,updates)=>{
setData(p=>({...p,[entity]:p[entity].map(i=>i.id===id?{...i,...updates}:i)}));
},[]);

const addData=useCallback((entity,item)=>{
setData(p=>({...p,[entity]:[...p[entity],item]}));
},[]);

const removeData=useCallback((entity,id)=>{
setData(p=>({...p,[entity]:p[entity].filter(i=>i.id!==id)}));
},[]);

const navigate=useCallback((p)=>{
setPrevPage(page);
setPage(p);
},[page]);

const goBack=useCallback(()=>{
setPage(prevPage);
},[prevPage]);

const login=useCallback((role)=>{
const u=MOCK.users.find(x=>x.role===role);
if(u){setUser(u);setPage(role==='cliente'?'home':'admin-dashboard');}
},[]);

const logout=useCallback(()=>{
setUser(null);
setPage('login');
});

const getCustomerTags=useCallback(c=>{
const tags=[...c.tags];
const days=c.last_visit?Math.floor((new Date()-new Date(c.last_visit))/864e5):999;
if(c.no_shows>=3&&!tags.includes('Attenzione'))tags.push('Attenzione');
if(c.no_shows>=2&&!tags.some(t=>t==='Da monitorare'))tags.push('Da monitorare');
if(days>90&&!tags.includes('Inattivo'))tags.push('Inattivo');
return tags.length?tags:['Cliente'];
},[]);

return <Ctx.Provider value={{user,data,setData,setUser,updateData,addData,removeData,toasts,addToast,page,setPage,navigate,goBack,login,logout,notifCount,setNotifCount,getCustomerTags}}>{children}</Ctx.Provider>;
}
const useApp=()=>useContext(Ctx);

// ======================== TOAST ========================
function Toasts(){
const{toasts}=useApp();
return <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-2 max-w-sm px-4 w-full">
{toasts.map(t=>(
<div key={t.id} className="toast-enter px-4 py-3 rounded-2xl shadow-xl text-sm font-medium text-white flex items-center gap-2" style={{background:t.type==='success'?'linear-gradient(135deg,#16A34A,#15803D)':t.type==='error'?'linear-gradient(135deg,#DC2626,#B91C1C)':'linear-gradient(135deg,#E8A7BB,#D48FA3)'}}>
{t.type==='success'?'✓':t.type==='error'?'✕':'ℹ'}{t.msg}
</div>
))}
</div>;
}

// ======================== LOGO ========================
function Logo({size='md'}){
const sz=size==='sm'?'text-lg':size==='lg'?'text-3xl':'text-xl';
return <span className={`font-display font-bold ${sz}`}>
<span className="text-primary">Glow</span><span style={{color:'#E8A7BB'}}>Book</span>
</span>;
}

function MiniChart({values,activeIndex}){
const max=Math.max(...values,1);
return <div className="mini-chart">{values.map((v,i)=>(

))}</div>;
}

// ======================== BOOKING FLOW ========================
function BookingFlow(){
const{navigate,data,addData,addToast}=useApp();
const[step,setStep]=useState(1);
const[selSvcs,setSelSvcs]=useState([]);
const[selDate,setSelDate]=useState(null);
const[selTime,setSelTime]=useState(null);
const[notes,setNotes]=useState('');
const[selCat,setSelCat]=useState('Tutti');

const toggleSvc=s=>{setSelSvcs(p=>p.find(x=>x.id===s.id)?p.filter(x=>x.id!==s.id):[...p,s])};
const totalDur=selSvcs.reduce((a,s)=>a+s.duration,0)+(selSvcs.length>1?(selSvcs.length-1)*10:0);
const totalPrice=selSvcs.reduce((a,s)=>a+s.price,0);

const cats=['Tutti',...data.categories.filter(c=>c!=='Pacchetti')];
const filtered=selCat==='Tutti'?data.services:data.services.filter(s=>s.cat===selCat&&s.active);

const next7=Array.from({length:7},(_,i)=>{const d=addDays(i);return{date:fmtDate(d),day:dayShort[d.getDay()],num:d.getDate(),month:monthShort[d.getMonth()]}});

const genSlots=ds=>{
const dow=new Date(ds).getDay();
const dk=['sun','mon','tue','wed','thu','fri','sat'][dow];
const hrs=data.working_hours[dk]||[];
const slots=[];
hrs.forEach(([st,end])=>{
let[h,m]=st.split(':').map(Number);
const[eh,em]=end.split(':').map(Number);
const endM=eh*60+em;
while(h*60+m<endM){
const t=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
const booked=data.appointments.some(a=>a.date===ds&&a.time===t&&!['cancelled_customer','cancelled_center'].includes(a.status));
slots.push({time:t,available:!booked});
m+=30;if(m>=60){h++;m-=60;}
}
});
return slots;
};

const submit=()=>{
const ap={id:'ap'+Date.now(),customer_id:'c1',services:selSvcs.map(s=>s.id),date:selDate,time:selTime,status:'pending',duration:totalDur,total_price:totalPrice,notes,staff_id:data.services[0]?.staff?.[0]||'st1',created_at:todayStr};
addData('appointments',ap);
addToast('Richiesta inviata con successo! 🌸');
setStep(5);
};

if(step===5)return <div className="animate-fade pb-24">
<Header title="Prenotazione"/>
<div className="flex flex-col items-center justify-center px-6 py-16">
<div className="w-20 h-20 rounded-full bg-gradient-to-br from-green-100 to-green-200 flex items-center justify-center mb-5 animate-bounce-in">
<svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" strokeWidth="3" className="w-10 h-10"><path d="M20 6L9 17l-5-5"/></svg>
</div>
<h2 className="font-display text-xl font-bold text-center mb-2">Richiesta inviata! 🌸</h2>
<p className="text-sm text-secondary text-center mb-6 max-w-xs">Glow Beauty Studio ti confermerà a breve. Riceverai una notifica su WhatsApp.</p>
<div className="card p-5 w-full max-w-sm mb-5 space-y-2">
<p className="text-sm font-semibold">{selSvcs.map(s=>s.name).join(' + ')}</p>
<p className="text-sm text-secondary">{selDate} alle {selTime}</p>
<p className="text-sm text-secondary">{totalDur} min • <span className="font-semibold" style={{color:'#E8A7BB'}}>{totalPrice} €</span></p>
</div>
<button onClick={()=>navigate('my-bookings')} className="btn-primary w-full max-w-sm">Vedi prenotazioni</button>
<button onClick={()=>navigate('home')} className="btn-ghost w-full max-w-sm mt-2">Torna alla home</button>
</div>
</div>;

return <div className="animate-fade pb-24">
<Header title={step===1?'Scegli servizi':step===2?'Scegli giorno':step===3?'Scegli orario':'Riepilogo'} back={()=>step>1?setStep(step-1):navigate('home')} showBack/>
<div className="flex justify-center gap-2 py-3">
{[1,2,3,4].map(s=><div key={s} className={`h-1.5 rounded-full transition-all duration-300 ${s<=step?'w-8' : 'w-4'} ${s<=step?'bg-gradient-to-r from-pink-400 to-pink-500':'bg-gray-200'}`}/>)}
</div>

{step===1&&<div className="px-5">
<div className="flex gap-2 overflow-x-auto hide-scrollbar -mx-5 px-5 mb-4">
{cats.map(c=><button key={c} onClick={()=>setSelCat(c)} className={`flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold transition-all ${selCat===c?'bg-gradient-to-r from-pink-400 to-pink-500 text-white shadow-sm':'bg-gray-100 text-secondary'}`}>{c}</button>)}
</div>
<div className="space-y-2">
{filtered.map(s=>{const sel=selSvcs.find(x=>x.id===s.id);
return <button key={s.id} onClick={()=>toggleSvc(s)} className={`w-full card p-4 flex items-center justify-between text-left transition-all active:scale-[0.99] ${sel?'border-pink-300 bg-pink-50/50':''}`}>
<div className="flex items-center gap-3">
<div className="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-lg">{s.icon}</div>
<div>
<div className="text-sm font-semibold">{s.name}</div>
<div className="text-xs text-secondary">{s.duration} min • {s.price} €</div>
</div>
</div>
<div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${sel?'border-pink-400 bg-pink-400':'border-gray-200'}`}>
{sel&&<svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" className="w-3.5 h-3.5"><path d="M20 6L9 17l-5-5"/></svg>}
</div>
</button>})}
</div>
{selSvcs.length>0&&<div className="sticky bottom-[72px] bg-white/95 backdrop-blur-xl border-t border-[#F0EEF0] p-4 -mx-5 px-5">
<div className="flex items-center justify-between mb-3">
<span className="text-sm text-secondary">{selSvcs.length} servizi • {totalDur} min</span>
<span className="text-lg font-bold" style={{color:'#E8A7BB'}}>{totalPrice} €</span>
</div>
<button onClick={()=>setStep(2)} className="btn-primary w-full">Continua</button>
</div>}
</div>}

{step===2&&<div className="px-5">
<p className="text-sm text-secondary mb-4">Seleziona il giorno preferito</p>
<div className="flex gap-2 overflow-x-auto hide-scrollbar -mx-5 px-5 mb-6">
{next7.map(d=><button key={d.date} onClick={()=>{setSelDate(d.date);setStep(3);}} className={`flex-shrink-0 card p-3 min-w-[72px] text-center transition-all active:scale-95 ${selDate===d.date?'border-pink-300 bg-pink-50':''}`}>
<div className="text-[10px] text-secondary font-medium">{d.day}</div>
<div className="text-xl font-bold my-0.5">{d.num}</div>
<div className="text-[10px] text-secondary">{d.month}</div>
</button>)}
</div>
<div>
<p className="text-xs text-secondary mb-2 font-medium">Oppure prenota più avanti</p>
<div className="grid grid-cols-4 gap-2">
{[7,14,21,30].map(d=>{const date=addDays(d);
return <button key={d} onClick={()=>{setSelDate(fmtDate(date));setStep(3);}} className="card p-3 text-center active:scale-95 transition-all">
<div className="text-sm font-semibold">{date.getDate()}/{date.getMonth()+1}</div>
<div className="text-[10px] text-secondary mt-0.5">+{d} giorni</div>
</button>})}
</div>
</div>
</div>}

{step===3&&selDate&&<div className="px-5">
<p className="text-sm text-secondary mb-1">Slot disponibili per</p>
<p className="font-semibold text-base mb-4">{selDate}</p>
<div className="grid grid-cols-3 gap-2">
{genSlots(selDate).map(sl=><button key={sl.time} onClick={()=>{setSelTime(sl.time);setStep(4);}} disabled={!sl.available} className={`p-3.5 rounded-xl text-sm font-semibold text-center transition-all ${sl.available?'slot-available hover:opacity-80 active:scale-95':'slot-booked opacity-40 cursor-not-allowed'}`}>
{sl.time}
</button>)}
</div>
</div>}

{step===4&&selDate&&selTime&&<div className="px-5 space-y-4">
<div className="card p-5">
<h3 className="font-semibold text-sm mb-3">Riepilogo</h3>
<div className="space-y-2">
{selSvcs.map(s=><div key={s.id} className="flex justify-between text-sm"><span>{s.name}</span><span className="font-semibold">{s.price} €</span></div>)}
<hr className="my-2 border-[#F0EEF0]"/>
<div className="flex justify-between text-sm"><span className="text-secondary">Durata</span><span>{totalDur} min</span></div>
<div className="flex justify-between text-base font-bold mt-1"><span>Totale</span><span style={{color:'#E8A7BB'}}>{totalPrice} €</span></div>
</div>
</div>
<div className="card p-5">
<label className="text-sm font-semibold mb-2 block">Note (opzionale)</label>
<textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Es. Allergie, preferenze..." className="w-full input-field resize-none" rows={3}/>
</div>
<button onClick={submit} className="btn-primary w-full py-4 text-base">Invia richiesta</button>
<p className="text-xs text-secondary text-center">La richiesta verrà confermata da Glow Beauty Studio via WhatsApp</p>
</div>}
</div>;
}

// ======================== ADMIN CALENDAR ========================
function AdminCalendar(){
const{navigate,data,updateData,addToast}=useApp();
const[view,setView]=useState('week');
const[selDate,setSelDate]=useState(todayStr);
const[showBlock,setShowBlock]=useState(false);
const[blockType,setBlockType]=useState('slot');
const[blockTime,setBlockTime]=useState('');
const[blockReason,setBlockReason]=useState('');

const sel=new Date(selDate);
const dow=sel.getDay();
const monday=new Date(sel);monday.setDate(sel.getDate()-(dow===0?6:dow-1));

const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return{date:fmtDate(d),day:dayShort[d.getDay()],num:d.getDate(),today:fmtDate(d)===todayStr,sel:fmtDate(d)===selDate}});

const genSlots=ds=>{
const dk=['sun','mon','tue','wed','thu','fri','sat'][new Date(ds).getDay()];
const hrs=data.working_hours[dk]||[];
const slots=[];
hrs.forEach(([st,end])=>{
let[h,m]=st.split(':').map(Number);
const[eh,em]=end.split(':').map(Number);
while(h*60+m<eh*60+em){
const t=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
const ap=data.appointments.find(a=>a.date===ds&&a.time===t&&!['cancelled_customer','cancelled_center'].includes(a.status));
const cust=ap?data.customers.find(c=>c.id===ap.customer_id):null;
slots.push({time:t,ap,cust,status:ap?(ap.status==='pending'?'pending':'booked'):'available'});
m+=30;if(m>=60){h++;m-=60;}
}
});
return slots;
};

const slots=genSlots(selDate);
const selDayAppts=slots.filter(s=>s.ap);

return <div className="animate-fade pb-24">
<Header title="Calendario" back={()=>navigate('admin-dashboard')} showBack/>
<div className="px-5 py-4">
<div className="flex gap-1.5 bg-gray-100 rounded-xl p-1 mb-4">
{['day','week','month'].map(v=><button key={v} onClick={()=>setView(v)} className={`flex-1 py-2 rounded-lg text-xs font-semibold transition-all ${view===v?'bg-white shadow-sm text-primary':'text-secondary'}`}>{v==='day'?'Giorno':v==='week'?'Settimana':'Mese'}</button>)}
</div>

<div className="flex items-center justify-between mb-4">
<button onClick={()=>{const d=new Date(selDate);d.setDate(d.getDate()-(view==='week'?7:1));setSelDate(fmtDate(d));}} className="p-2 rounded-xl hover:bg-gray-50"><Icons.ChevronLeft/></button>
<div className="text-center">
<div className="font-semibold text-sm">{selDate===todayStr?'Oggi':`${sel.getDate()} ${monthShort[sel.getMonth()]} ${sel.getFullYear()}`}</div>
</div>
<button onClick={()=>{const d=new Date(selDate);d.setDate(d.getDate()+(view==='week'?7:1));setSelDate(fmtDate(d));}} className="p-2 rounded-xl hover:bg-gray-50"><Icons.ChevronRight/></button>
</div>

{view==='week'&&<div className="flex gap-1.5 mb-4 overflow-x-auto">
{weekDays.map(d=><button key={d.date} onClick={()=>setSelDate(d.date)} className={`flex-1 min-w-[48px] py-2.5 rounded-xl text-center transition-all ${d.today?'bg-gradient-to-br from-pink-400 to-pink-500 text-white shadow-sm':d.sel?'bg-pink-50 border border-pink-200':'bg-gray-50 hover:bg-gray-100'}`}>
<div className="text-[10px] font-medium opacity-80">{d.day}</div>
<div className="text-sm font-bold">{d.num}</div>
{data.appointments.some(a=>a.date===d.date&&a.status==='confirmed')&&<div className={`w-1.5 h-1.5 rounded-full mx-auto mt-0.5 ${d.today?'bg-white':'bg-pink-400'}`}/>}
</button>)}
</div>}

{view==='month'&&<div className="mb-4">
<div className="grid grid-cols-7 gap-0.5 mb-1">
{dayShort.map(d=><div key={d} className="text-center text-[10px] text-secondary py-2 font-medium">{d}</div>)}
</div>
{(()=>{const days=[];const fd=new Date(sel.getFullYear(),sel.getMonth(),1);const ld=new Date(sel.getFullYear(),sel.getMonth()+1,0);let sd=fd.getDay()||7;
for(let i=1;i<sd;i++)days.push(null);
for(let i=1;i<=ld.getDate();i++){const d=new Date(sel.getFullYear(),sel.getMonth(),i);days.push({date:fmtDate(d),num:i,today:fmtDate(d)===todayStr,sel:fmtDate(d)===selDate,hasAppt:data.appointments.some(a=>a.date===fmtDate(d)&&a.status==='confirmed')});}
return <div className="grid grid-cols-7 gap-0.5">{days.map((d,i)=>d?<button key={i} onClick={()=>setSelDate(d.date)} className={`py-2.5 rounded-lg text-sm transition-all ${d.today?'bg-gradient-to-br from-pink-400 to-pink-500 text-white font-bold':d.sel?'bg-pink-50 border border-pink-200 font-semibold':'hover:bg-gray-50'}`}>
{d.num}
{d.hasAppt&&!d.today&&<div className="w-1 h-1 rounded-full bg-pink-400 mx-auto mt-0.5"/>}
</button>:<div key={i}/>)}</div>})()}
</div>}

{view==='day'&&<div className="space-y-1.5">
{slots.map(sl=><div key={sl.time} className={`flex items-center gap-3 p-3 rounded-xl transition-all ${sl.status==='available'?'bg-green-50/50 hover:bg-green-50':sl.status==='pending'?'bg-amber-50/50':'bg-blue-50/50'}`}>
<span className="text-sm font-mono font-semibold w-14 text-secondary">{sl.time}</span>
{sl.ap?<div className="flex-1 min-w-0">
<div className="text-sm font-semibold truncate">{sl.cust?.name}</div>
<div className="text-[11px] text-secondary truncate">{sl.ap.services.map(sid=>data.services.find(s=>s.id===sid)?.name).join(', ')}</div>
<span className={`status-badge ${sl.status==='pending'?'badge-pending':'badge-confirmed'}`}>{sl.status==='pending'?'In attesa':'Confermato'}</span>
</div>:<div className="flex-1 text-sm text-green-700 font-medium">Disponibile</div>}
{sl.status==='available'&&<button onClick={()=>{setBlockTime(sl.time);setShowBlock(true);}} className="text-[10px] text-red-500 px-2 py-1 rounded-lg bg-white/80 font-semibold hover:bg-red-50">Blocca</button>}
</div>)}
</div>}

{selDayAppts.length>0&&view==='day'&&<div className="mt-4">
<h4 className="text-xs font-semibold text-secondary uppercase tracking-wider mb-2">{selDayAppts.length} appuntamenti</h4>
</div>}
</div>

{showBlock&&<div className="fixed inset-0 bg-black/30 z-50 flex items-end" onClick={()=>setShowBlock(false)}>
<div className="bg-white w-full rounded-t-3xl p-6 animate-slide" onClick={e=>e.stopPropagation()}>
<div className="flex items-center justify-between mb-4">
<h3 className="font-semibold text-lg">Blocca orario</h3>
<button onClick={()=>setShowBlock(false)} className="p-1 rounded-lg hover:bg-gray-100"><Icons.X/></button>
</div>
<div className="space-y-4">
<select value={blockType} onChange={e=>setBlockType(e.target.value)} className="w-full input-field">
<option value="slot">Singolo slot ({blockTime})</option>
<option value="morning">Mattinata</option>
<option value="afternoon">Pomeriggio</option>
<option value="day">Giornata intera</option>
<option value="vacation">Ferie</option>
</select>

function AdminRequests(){
const{navigate,data,updateData,addData,addToast}=useApp();
const[action,setAction]=useState(null);
const[selReq,setSelReq]=useState(null);
const[newTime,setNewTime]=useState('');
const[rejectReason,setRejectReason]=useState('');

const pending=data.appointments.filter(a=>a.status==='pending');
const newTimeAppts=data.appointments.filter(a=>a.status==='new_time');

const doAction=(apId,act)=>{
const ap=data.appointments.find(a=>a.id===apId);
const cust=data.customers.find(c=>c.id===ap?.customer_id);
const svcs=ap?.services.map(sid=>data.services.find(s=>s.id===sid)?.name).join(' e ');

if(act==='accept'){
updateData('appointments',apId,{status:'confirmed'});
addToast(`Richiesta di ${cust?.name} accettata ✓`);
addData('whatsapp_logs',{id:'wl'+Date.now(),customer_id:ap.customer_id,direction:'outbound',text:`Ciao ${cust?.name?.split(' ')[0]} 🌸\nLa tua prenotazione è stata confermata!\n\n📅 ${ap.date} alle ${ap.time}\n💅 ${svcs}\n\nTi aspettiamo da Glow Beauty Studio ✨`,intent:'booking_confirmed',confidence:0.99,status:'delivered',date:todayStr,appointment_id:apId});
addData('whatsapp_logs',{id:'wl'+(Date.now()+1),customer_id:ap.customer_id,direction:'outbound',text:`📧 Email di conferma inviata a ${cust?.email}`,intent:'email_sent',confidence:0.99,status:'delivered',date:todayStr,appointment_id:apId});
}else if(act==='reject'){
updateData('appointments',apId,{status:'rejected'});
addToast(`Richiesta di ${cust?.name} rifiutata`,'error');
addData('whatsapp_logs',{id:'wl'+Date.now(),customer_id:ap.customer_id,direction:'outbound',text:`Ciao ${cust?.name?.split(' ')[0]} 🌸\nPurtroppo non possiamo accettare la tua richiesta per il ${ap.date}.\n\n${rejectReason||'Ti invitiamo a scegliere un altro orario.'}\n\nCi scusiamo per il disagio 💕`,intent:'booking_rejected',confidence:0.95,status:'delivered',date:todayStr,appointment_id:apId});
}else if(act==='newtime'){
updateData('appointments',apId,{status:'new_time'});
addToast(`Nuovo orario proposto a ${cust?.name}`);
addData('whatsapp_logs',{id:'wl'+Date.now(),customer_id:ap.customer_id,direction:'outbound',text:`Ciao ${cust?.name?.split(' ')[0]} 🌸\nPer il ${ap.date} l'orario ${ap.time} non è disponibile.\n\nTi proponiamo: ${newTime||'15:00'}\n\nFammi sapere se va bene! 💕`,intent:'new_time_proposed',confidence:0.93,status:'delivered',date:todayStr,appointment_id:apId});
}
setAction(null);setSelReq(null);
};

return <div className="animate-fade pb-24">

<div className="px-5 py-4 space-y-3">
{pending.length===0&&<div className="text-center py-12"><div className="text-4xl mb-3">✅</div><p className="text-sm text-secondary font-medium">Nessuna richiesta in attesa</p></div>}
{pending.map(a=>{const cust=data.customers.find(c=>c.id===a.customer_id);const svcs=a.services.map(sid=>data.services.find(s=>s.id===sid)?.name).join(' + ');const staff=data.staff.find(s=>s.id===a.staff_id);
return <div key={a.id} className="card p-4 bg-gradient-to-r from-amber-50 to-orange-50/50 border-amber-200/50">

<div className="flex items-center gap-3">
<span className="text-xl">{cust?.avatar}</span>
<div>
<div className="text-sm font-semibold">{cust?.name}</div>
<div className="text-[11px] text-secondary">{cust?.phone}</div>
</div>
</div>
<span className="status-badge badge-pending">In attesa</span>
</div>
<div className="card p-3 bg-white/60 rounded-xl mb-3">
<div className="text-sm font-medium">{svcs}</div>
<div className="flex items-center gap-3 mt-1.5 text-xs text-secondary">

<span className="flex items-center gap-1"><Icons.Clock w="4" h="4"/> {a.time}</span>
<span>{a.duration} min</span>
<span className="font-semibold" style={{color:'#E8A7BB'}}>{a.total_price} €</span>
</div>
{a.notes&&<p className="text-xs text-secondary mt-2 italic">📝 {a.notes}</p>}
{staff&&<p className="text-xs text-secondary mt-1">👤 {staff.name}</p>}
</div>
<div className="flex gap-2">
<button onClick={()=>{setSelReq(a);setAction('accept');}} className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-green-400 to-green-500 text-white text-sm font-semibold shadow-sm active:scale-[0.98] transition-all">✓ Accetta</button>
<button onClick={()=>{setSelReq(a);setAction('newtime');}} className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-purple-400 to-purple-500 text-white text-sm font-semibold shadow-sm active:scale-[0.98] transition-all">⏰ Altro orario</button>
<button onClick={()=>{setSelReq(a);setAction('reject');}} className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-red-400 to-red-500 text-white text-sm font-semibold shadow-sm active:scale-[0.98] transition-all">✕ Rifiuta</button>
</div>
</div>})}

{newTimeAppts.length>0&&<div className="mt-4">
<h3 className="font-semibold text-sm mb-3">Nuovi orari proposti</h3>
{newTimeAppts.map(a=>{const cust=data.customers.find(c=>c.id===a.customer_id);
return <div key={a.id} className="card p-4 bg-gradient-to-r from-purple-50 to-violet-50 border-purple-200/50">
<div className="flex items-center justify-between">
<div>
<div className="text-sm font-semibold">{cust?.name}</div>
<div className="text-[11px] text-secondary">Richiesto: {a.date} {a.time}</div>
</div>
<span className="status-badge badge-new-time">In attesa risposta</span>
</div>
</div>})}
</div>}

{action&&selReq&&<div className="fixed inset-0 bg-black/30 z-50 flex items-end" onClick={()=>{setAction(null);setSelReq(null);}}>
<div className="bg-white w-full rounded-t-3xl p-6 animate-slide" onClick={e=>e.stopPropagation()}>
<div className="flex items-center justify-between mb-4">
<h3 className="font-semibold text-lg">{action==='accept'?'Accetta richiesta':action==='reject'?'Rifiuta richiesta':'Proponi nuovo orario'}</h3>
<button onClick={()=>{setAction(null);setSelReq(null);}} className="p-1 rounded-lg hover:bg-gray-100"><Icons.X/></button>
</div>
{action==='accept'&&<div>
<p className="text-sm text-secondary mb-4">Confermerai la prenotazione di <b>{data.customers.find(c=>c.id===selReq.customer_id)?.name}</b> per il {selReq.date} alle {selReq.time}.</p>
<div className="bg-green-50 rounded-xl p-3 mb-4">
<p className="text-xs text-green-700">📱 Verrà inviato un messaggio WhatsApp di conferma</p>
<p className="text-xs text-green-700 mt-1">📧 Verrà inviata un'email di conferma</p>
</div>
<div className="flex gap-3">
<button onClick={()=>doAction(selReq.id,'accept')} className="btn-primary flex-1">Conferma e notifica</button>
<button onClick={()=>{setAction(null);setSelReq(null);}} className="btn-ghost flex-1">Annulla</button>
</div>
</div>}
{action==='reject'&&<div>
<label className="text-xs text-secondary font-semibold mb-1 block">Motivo (opzionale)</label>
<textarea value={rejectReason} onChange={e=>setRejectReason(e.target.value)} placeholder="Es. Slot già occupato..." className="w-full input-field mb-4" rows={3}/>
<div className="flex gap-3">
<button onClick={()=>doAction(selReq.id,'reject')} className="flex-1 py-3 rounded-xl bg-gradient-to-r from-red-400 to-red-500 text-white text-sm font-semibold shadow-sm">Rifiuta</button>
<button onClick={()=>{setAction(null);setSelReq(null);}} className="btn-ghost flex-1">Annulla</button>
</div>
</div>}
{action==='newtime'&&<div>
<label className="text-xs text-secondary font-semibold mb-1 block">Data</label>
<input type="date" defaultValue={selReq.date} className="w-full input-field mb-3"/>

<select value={newTime} onChange={e=>setNewTime(e.target.value)} className="w-full input-field mb-4">
{['09:00','09:30','10:00','10:30','11:00','11:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'].map(t=><option key={t}>{t}</option>)}
</select>
<div className="flex gap-3">
<button onClick={()=>doAction(selReq.id,'newtime')} className="btn-primary flex-1">Invia proposta</button>
<button onClick={()=>{setAction(null);setSelReq(null);}} className="btn-ghost flex-1">Annulla</button>
</div>
</div>}
</div>
</div>}
</div>
</div>;
}

// ======================== ADMIN REVIEWS ========================
function AdminReviews(){
const{navigate,data,updateData,addToast}=useApp();
const pending=data.reviews.filter(r=>!r.approved);
const approved=data.reviews.filter(r=>r.approved);
const avgRating=approved.reduce((a,r)=>a+r.rating,0)/(approved.length||1);

return <div className="animate-fade pb-24">
<Header title="Recensioni" back={()=>navigate('admin-dashboard')} showBack/>
<div className="px-5 py-4">
<div className="card p-5 text-center mb-5 gradient-pink">
<div className="text-3xl font-bold text-primary mb-1">★ {avgRating.toFixed(1)}</div>
<div className="text-sm text-secondary">{approved.length} recensioni pubblicate</div>
<div className="flex justify-center gap-0.5 mt-2">{[1,2,3,4,5].map(i=><span key={i} className={i<=Math.round(avgRating)?'text-yellow-400 text-lg':'text-gray-300 text-lg'}>★</span>)}</div>
</div>

{pending.length>0&&<div className="mb-6">
<h3 className="font-semibold text-sm mb-3 flex items-center gap-2">
<span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"/>
In attesa ({pending.length})
</h3>
{pending.map(r=>{const cust=data.customers.find(c=>c.id===r.customer_id);const svc=data.services.find(s=>s.id===r.service_id);
return <div key={r.id} className="card p-4 mb-3 bg-gradient-to-r from-amber-50 to-orange-50/50 border-amber-200/50">
<div className="flex items-center gap-3 mb-2">
<span className="text-xl">{cust?.avatar}</span>
<div>
<div className="text-sm font-semibold">{cust?.name}</div>
<div className="text-[11px] text-secondary">{svc?.name}</div>
</div>
</div>
<div className="flex gap-0.5 mb-2">{[1,2,3,4,5].map(i=><span key={i} className={i<=r.rating?'text-yellow-400':'text-gray-200'}>★</span>)}</div>
<p className="text-sm text-secondary leading-relaxed">"{r.comment}"</p>
<div className="flex gap-2 mt-3">
<button onClick={()=>{updateData('reviews',r.id,{approved:true});addToast('Recensione approvata ✓');}} className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-green-400 to-green-500 text-white text-sm font-semibold shadow-sm">✓ Approva</button>
<button onClick={()=>{updateData('reviews',r.id,{approved:'hidden'});addToast('Recensione nascosta','error');}} className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-red-400 to-red-500 text-white text-sm font-semibold shadow-sm">✕ Nascondi</button>
</div>
</div>})}
</div>}

<h3 className="font-semibold text-sm mb-3">Pubblicate</h3>
{approved.map(r=>{const cust=data.customers.find(c=>c.id===r.customer_id);
return <div key={r.id} className="card p-4 mb-2">
<div className="flex items-center gap-3 mb-2">
<span className="text-xl">{cust?.avatar}</span>
<div>
<div className="text-sm font-semibold">{cust?.name}</div>
<div className="flex gap-0.5">{[1,2,3,4,5].map(i=><span key={i} className={i<=r.rating?'text-yellow-400 text-xs':'text-gray-200 text-xs'}>★</span>)}</div>
</div>
</div>
<p className="text-sm text-secondary leading-relaxed">"{r.comment}"</p>
</div>})}
</div>
</div>;
}

// ======================== ADMIN WHATSAPP ========================
function AdminWhatsApp(){
const{navigate,data,addData,addToast}=useApp();
const[input,setInput]=useState('');
const[typing,setTyping]=useState(false);
const chatRef=useRef(null);

const logs=data.whatsapp_logs.slice(-30);

useEffect(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},[logs]);

const botResponses={
'manicure':{text:'Ciao! 🌸 Per la manicure semipermanente abbiamo questi slot disponibili questa settimana:\n\n🕐 Lunedì 14:00\n🕐 Martedì 10:30\n🕐 Giovedì 16:00\n🕐 Venerdì 11:00\n\nLa manicure dura 45 min e costa 25€. Quale preferisci?',intent:'booking_options'},
'prezzo':{text:'I nostri prezzi 🌸:\n\n💅 Manicure semipermanente: 25€\n🦶 Pedicure estetico: 30€\n✨ Ceretta gambe: 28€\n👁️ Sopracciglia: 10€\n👀 Laminazione ciglia: 45€\n💆‍♀️ Trattamento viso: 55€\n💆 Massaggio relax: 50€\n💄 Make-up evento: 60€',intent:'faq_answer'},
'orario':{text:'Glow Beauty Studio è aperto 🌸:\n\n📅 Lun-Ven: 09:00-19:00\n📅 Sabato: 09:00-18:00\n📅 Domenica: chiuso\n\nPausa pranzo: 13:00-14:00',intent:'faq_answer'},
'indirizzo':{text:'Ci trovi in Via Roma 42, Milano 📍\n\nA 2 minuti dalla fermata M1 San Babila!\nC\'è un parcheggio nelle vicinanze 🚗',intent:'faq_answer'},
'promo':{text:'Promozioni attive 🌸:\n\n✨ Trattamento viso: -20% fino al 30/06 (codice: GLOWFACE20)\n💅 Pacchetto manicure: 5 sedute a 110€ (codice: MANI5)\n💆 Pacchetto relax: 3 massaggi a 130€ (codice: RELAX3)\n🎉 Benvenuta: -15% primo trattamento (codice: WELCOME15)',intent:'faq_answer'},
'conferm':{text:'Perfetto! ✅ Confermo la tua risposta.\n\nTi aspettiamo da Glow Beauty Studio! 🌸\n\nRiceverai un promemoria 24h prima dell\'appuntamento.',intent:'confirmation'},
'default':{text:'Grazie per il tuo messaggio 🌸\n\nPosso aiutarti con:\n• Prenotare un appuntamento\n• Informazioni su prezzi e servizi\n• Orari e indirizzo\n• Promozioni attive\n\nCosa posso fare per te? 💕',intent:'general'}
};

const detectIntent=msg=>{
const l=msg.toLowerCase();
if(l.includes('manicure')||l.includes('prenotare')||l.includes('prenota'))return'booking_request';
if(l.includes('costa')||l.includes('prezzo')||l.includes('quanto')||l.includes('tariffe'))return'faq_price';
if(l.includes('orario')||l.includes('aperto')||l.includes('chiuso')||l.includes('ora'))return'faq_hours';
if(l.includes('indirizzo')||l.includes('dove')||l.includes('via')||l.includes('trov'))return'faq_address';
if(l.includes('promo')||l.includes('sconto')||l.includes('offerta'))return'faq_promo';
if(l.includes('conferm')||l.includes('sì')||l.includes('si ')||l.includes('ok'))return'confirmation';
return'general';
};

const sendMsg=()=>{
if(!input.trim())return;
const cust=data.customers[0];
addData('whatsapp_logs',{id:'wl'+Date.now(),customer_id:cust.id,direction:'inbound',text:input,intent:detectIntent(input),confidence:0.85+Math.random()*0.1,status:'read',date:todayStr,appointment_id:null});
const intent=detectIntent(input);
setTyping(true);
setTimeout(()=>{
const resp=botResponses[intent]||botResponses['default'];
addData('whatsapp_logs',{id:'wl'+(Date.now()+1),customer_id:cust.id,direction:'outbound',text:resp.text,intent:resp.intent,confidence:0.9+Math.random()*0.08,status:'delivered',date:todayStr,appointment_id:null});
setTyping(false);
addToast('Risposta WhatsApp simulata inviata ✓');
},1200+Math.random()*800);
setInput('');
};

const quickActions=['Manicure','Prezzi','Orari','Indirizzo','Promo','Confermo'];

return <div className="animate-fade pb-24">
<Header title="WhatsApp Bot" back={()=>navigate('admin-dashboard')} showBack/>
<div className="px-5 py-4">
<div className="card p-4 mb-4 bg-gradient-to-r from-green-50 to-green-100/50 border-green-200/50">
<div className="flex items-center gap-2 mb-2">
<Icons.WhatsApp/><span className="text-sm font-semibold text-green-800">Glow Beauty Studio Bot</span>
</div>
<p className="text-xs text-green-700 leading-relaxed">Bot intelligente che risponde come Glow Beauty Studio. Struttura pronta per WhatsApp Business Cloud API con webhook e template.</p>
<div className="flex gap-1.5 mt-3 flex-wrap">
{quickActions.map(q=><button key={q} onClick={()=>setInput(q)} className="text-[10px] px-2.5 py-1 bg-white rounded-full text-green-700 border border-green-200 font-medium hover:bg-green-50 transition-all">{q}</button>)}
</div>
</div>

<div ref={chatRef} className="rounded-2xl overflow-hidden mb-4" style={{background:'#E5DDD5',backgroundImage:'url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMCwwLDAsMC4wNSkiLz48L3N2Zz4=)',height:'380px',overflowY:'auto',padding:'12px'}}>
{logs.map((log,i)=>{const isIn=log.direction==='inbound';
return <div key={log.id} className={`mb-2 flex ${isIn?'justify-end':'justify-start'} animate-fade`}>
<div className={`max-w-[82%] rounded-2xl px-3.5 py-2.5 shadow-sm ${isIn?'bg-[#D9FDD3] rounded-tr-md':'bg-white rounded-tl-md'}`}>
<p className="text-[13px] whitespace-pre-line leading-relaxed" style={{color:isIn?'#111':'#333'}}>{log.text}</p>
<div className="flex items-center justify-end gap-1.5 mt-1">
<span className="text-[9px] text-gray-400">{log.intent}</span>
<span className="text-[9px] text-gray-400">✓✓</span>
</div>
</div>
</div>})}
{typing&&<div className="flex justify-start animate-fade">
<div className="bg-white rounded-2xl rounded-tl-md px-4 py-3 shadow-sm">
<div className="flex gap-1.5">
<div className="typing-dot w-2 h-2 rounded-full bg-gray-400"/><div className="typing-dot w-2 h-2 rounded-full bg-gray-400"/><div className="typing-dot w-2 h-2 rounded-full bg-gray-400"/>
</div>
</div>
</div>}
</div>

<div className="flex gap-2">
<input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMsg()} placeholder="Simula messaggio cliente..." className="flex-1 input-field"/>
<button onClick={sendMsg} className="btn-primary px-4 flex items-center justify-center"><Icons.Send/></button>
</div>

<div className="mt-5">
<h3 className="font-semibold text-sm mb-3">Log messaggi</h3>
<div className="card overflow-hidden">
<div className="overflow-x-auto">
<table className="w-full text-xs min-w-[400px]">
<thead className="bg-gray-50"><tr>
<th className="p-3 text-left font-semibold text-secondary">Dir.</th>
<th className="p-3 text-left font-semibold text-secondary">Intent</th>
<th className="p-3 text-left font-semibold text-secondary">Conf.</th>
<th className="p-3 text-left font-semibold text-secondary">Stato</th>
<th className="p-3 text-left font-semibold text-secondary">Data</th>
</tr></thead>
<tbody>
{logs.slice().reverse().slice(0,10).map(log=>(
<tr key={log.id} className="border-t border-[#F0EEF0] hover:bg-gray-50">
<td className="p-3"><span className={`font-semibold ${log.direction==='inbound'?'text-blue-600':'text-green-600'}`}>{log.direction==='inbound'?'← In':'→ Out'}</span></td>
<td className="p-3 font-medium">{log.intent}</td>
<td className="p-3">{Math.round(log.confidence*100)}%</td>
<td className="p-3">{log.status}</td>
<td className="p-3 text-secondary">{log.date}</td>
</tr>
))}
</tbody>
</table>
</div>
</div>
</div>

<div className="mt-5 card p-4 bg-blue-50 border-blue-200/50">
<h4 className="text-sm font-semibold text-blue-800 mb-2">🔌 Integrazione WhatsApp Business API</h4>
<ul className="text-xs text-blue-700 space-y-1.5">
<li>• Webhook per messaggi in ingresso</li>
<li>• Template messages per conferme</li>
<li>• Interactive buttons per scelte rapide</li>
<li>• Media messages per invio foto servizi</li>
<li>• Catalog integration per listino prezzi</li>
</ul>
</div>
</div>
</div>;
}

// ======================== ADMIN STATS ========================
function AdminStats(){
const{navigate,data}=useApp();
const completed=data.appointments.filter(a=>a.status==='completed');
const revenue=completed.reduce((a,x)=>a+x.total_price,0);
const avgR=data.reviews.filter(r=>r.approved).reduce((a,r)=>a+r.rating,0)/(data.reviews.filter(r=>r.approved).length||1);
const retention=(data.customers.filter(c=>c.completed>=3).length/data.customers.length*100).toFixed(0);

const svcCount={};
data.appointments.forEach(a=>a.services.forEach(sid=>{svcCount[sid]=(svcCount[sid]||0)+1}));
const topSvc=Object.entries(svcCount).sort((a,b)=>b[1]-a[1]);

const monthlyData=[15,22,18,25,30,28,35];

return <div className="animate-fade pb-24">
<Header title="Statistiche" back={()=>navigate('admin-dashboard')} showBack/>
<div className="px-5 py-4">
<div className="grid grid-cols-2 gap-3 mb-6">
{[
{label:'Fatturato',value:`${revenue}€`,sub:'stimato totale',icon:'💰',color:'text-green-600'},
{label:'Recensioni',value:`★ ${avgR.toFixed(1)}`,sub:`${data.reviews.filter(r=>r.approved).length} recensioni`,icon:'⭐',color:'text-yellow-500'},
{label:'Ricorrenti',value:`${retention}%`,sub:'clienti fidelizzati',icon:'🔄',color:'text-blue-600'},
{label:'No-show',value:`${(data.appointments.filter(a=>a.status==='no_show').length/data.appointments.length*100).toFixed(0)}%`,sub:'tasso assenze',icon:'❌',color:'text-red-500'},
].map(s=><div key={s.label} className="card p-4">
<div className="text-2xl mb-1">{s.icon}</div>
<div className={`text-xl font-bold ${s.color}`}>{s.value}</div>
<div className="text-[11px] text-secondary">{s.label} • {s.sub}</div>
</div>)}
</div>

<div className="card p-5 mb-5">
<h3 className="font-semibold text-sm mb-4">Andamento mensile</h3>
<div className="flex items-end gap-4 h-32">
{monthlyData.map((v,i)=>{const max=Math.max(...monthlyData);
return <div key={i} className="flex-1 flex flex-col items-center gap-1">
<div className="w-full rounded-t-xl bg-gradient-to-t from-pink-400 to-pink-300 transition-all duration-500" style={{height:`${(v/max)*100}%`,minHeight:'12px'}}/>
<span className="text-[10px] text-secondary">{monthShort[(today.getMonth()-6+i+12)%12]}</span>
</div>})}
</div>
</div>

<h3 className="font-semibold text-sm mb-3">Classifica servizi</h3>
{topSvc.map(([sid,count],i)=>{const svc=data.services.find(s=>s.id===sid);const max=topSvc[0][1];
return <div key={sid} className="flex items-center gap-3 mb-3">
<span className="text-sm text-secondary w-6 font-mono font-bold">#{i+1}</span>
<div className="flex-1">
<div className="flex justify-between text-sm mb-1">
<span className="font-medium">{svc?.name}</span>
<span className="text-xs text-secondary font-semibold">{count}</span>
</div>
<div className="progress-bar"><div className="progress-fill" style={{width:`${(count/max)*100}%`}}/></div>
</div>
</div>})}

<h3 className="font-semibold text-sm mb-3 mt-6">Segmenti clienti</h3>
<div className="space-y-3">
{[
{label:'VIP',count:data.customers.filter(c=>c.completed>=6).length,color:'bg-yellow-400',pct:Math.round(data.customers.filter(c=>c.completed>=6).length/data.customers.length*100)},
{label:'Ricorrenti',count:data.customers.filter(c=>c.completed>=3&&c.completed<6).length,color:'bg-green-400',pct:Math.round(data.customers.filter(c=>c.completed>=3&&c.completed<6).length/data.customers.length*100)},
{label:'Nuovi',count:data.customers.filter(c=>c.completed>=1&&c.completed<3).length,color:'bg-blue-400',pct:Math.round(data.customers.filter(c=>c.completed>=1&&c.completed<3).length/data.customers.length*100)},
{label:'Inattivi',count:data.customers.filter(c=>{const d=c.last_visit?Math.floor((new Date()-new Date(c.last_visit))/864e5):999;return d>90}).length,color:'bg-gray-400',pct:Math.round(data.customers.filter(c=>{const d=c.last_visit?Math.floor((new Date()-new Date(c.last_visit))/864e5):999;return d>90}).length/data.customers.length*100)},
].map(seg=><div key={seg.label} className="flex items-center gap-3">
<div className={`w-3 h-3 rounded-full ${seg.color}`}/>
<span className="text-sm flex-1 font-medium">{seg.label}</span>
<span className="text-sm font-bold w-8 text-right">{seg.count}</span>
<span className="text-xs text-secondary w-10">{seg.pct}%</span>
</div>)}
</div>
</div>
</div>;
}

<span className="text-sm font-medium">{it.label}</span>
<button onClick={()=>{updateData('settings',settings.center_id,{[it.label.includes('WhatsApp')?'whatsapp_enabled':it.label.includes('Email')?'email_enabled':it.label.includes('Multi')?'multi_center':'reminder_24h']:!it.on})}} className={`w-12 h-7 rounded-full transition-all ${it.on?'bg-gradient-to-r from-pink-400 to-pink-500':'bg-gray-200'}`}>
<div className={`w-5 h-5 bg-white rounded-full shadow-sm transition-all transform ${it.on?'translate-x-6':'translate-x-1'}`}/>
</button>
</div>)}
</div>
</div>

<div>
<h3 className="font-semibold text-sm mb-3">Orari apertura</h3>
<div className="card p-5 space-y-2">
{[['Lun','mon'],['Mar','tue'],['Mer','wed'],['Gio','thu'],['Ven','fri'],['Sab','sat'],['Dom','sun']].map(([label,key])=>{
const hrs=data.working_hours[key]||[];
const isOpen=hrs.length>0;
return <div key={key} className="flex items-center justify-between py-2 border-b border-[#F0EEF0] last:border-0">
<span className="text-sm font-medium">{label}</span>
<span className="text-sm text-secondary">{isOpen?`${hrs[0][0]}-${hrs[hrs.length-1][1]}`:'Chiuso'}</span>
</div>})}
</div>
</div>

<div>
<h3 className="font-semibold text-sm mb-3">Staff</h3>
<div className="space-y-2">
{data.staff.map(s=><div key={s.id} className="card p-4 flex items-center gap-3">
<span className="text-xl">{s.avatar}</span>
<div className="flex-1">
<div className="text-sm font-semibold">{s.name}</div>
<div className="text-xs text-secondary">{s.role}</div>
</div>
<div className="text-right">
<div className="text-sm font-bold">★ {s.rating}</div>
<div className="text-[10px] text-secondary">{s.clients} clienti</div>
</div>
</div>)}
</div>
</div>

<div className="card p-5 bg-gradient-to-r from-red-50 to-orange-50 border-red-200/50">
<h3 className="font-semibold text-sm text-red-700 mb-3 flex items-center gap-2"><Icons.Shield w="4" h="4"/>Zona pericolosa</h3>
<button onClick={logout} className="w-full py-3 rounded-xl bg-gradient-to-r from-red-400 to-red-500 text-white text-sm font-semibold flex items-center justify-center gap-2 shadow-sm"><Icons.LogOut w="4" h="4"/>Esci dall'account</button>
</div>

<div className="text-center text-xs text-secondary py-4">
GlowBook v1.0.0<br/>© 2025 GlowBook — SaaS per centri estetici
</div>
</div>
</div>;
}

// ======================== MAIN APP ========================
function App(){
const{page,user}=useApp();

if(!user)return <Login/>;

if(user.role==='cliente')return <>
<Toasts/>
{page==='home'&&<CustHome/>}
{page==='book'&&<BookingFlow/>}
{page==='services'&&<CustServices/>}
{page==='my-bookings'&&<MyBookings/>}
{page==='promotions'&&<Promotions/>}
{page==='profile'&&<CustProfile/>}
{page==='packages'&&<Promotions/>}
{page==='reviews'&&<Promotions/>}
<CustNav/>
</>;

return <>
<Toasts/>
{page==='admin-dashboard'&&<AdminDash/>}
{page==='admin-calendar'&&<AdminCalendar/>}
{page==='admin-requests'&&<AdminRequests/>}
{page==='admin-customers'&&<AdminCustomers/>}
{page==='admin-services'&&<AdminServices/>}
{page==='admin-promotions'&&<AdminPromotions/>}
{page==='admin-packages'&&<AdminPackages/>}
{page==='admin-reviews'&&<AdminReviews/>}
{page==='admin-whatsapp'&&<AdminWhatsApp/>}
{page==='admin-stats'&&<AdminStats/>}
{page==='admin-settings'&&<AdminSettings/>}
<AdminNav/>
</>;
}

function Root(){return <Provider><div className="max-w-lg mx-auto bg-white min-h-screen shadow-2xl relative"><App/></div></Provider>}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
